<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة</title>
    
    <meta name="google-site-verification" content="Apib7-x98H0j5cPqHWwSMm6dNU4GmODRoqxLiDzdx9I" />

    <meta name="description" content="حاسبة إلكترونية سريعة لحساب تاريخ تجديد الإقامة قبل سنة إلا 10 أيام بدقة وسهولة.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl;   
            background-color: #ffffff;
            cursor: pointer;
            /* إجبار المتصفح على عرض الأرقام الإنجليزية داخل المربع */
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
        }
        input.date-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .clear-btn {
            background-color: #fee2e2;
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .clear-btn:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }
        .clear-btn:hover .trash-icon {
            fill: #ffffff;
        }
        .trash-icon {
            width: 20px;
            height: 20px;
            fill: var(--danger-color);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 0.95rem;
            color: #0369a1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .result-date {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0c4a6e;
            letter-spacing: 1px;
            /* إجبار أرقام النتيجة على الظهور بالتسلسل الإنجليزي أيضاً */
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
        }
        /* إجبار لوحة التقويم بالكامل على استخدام الأرقام الإنجليزية */
        .flatpickr-calendar, .flatpickr-day, .flatpickr-months, .flatpickr-current-month .numInputWrapper {
            font-variant-numeric: lining-nums !important;
            font-feature-settings: "lnum" !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة تاريخ تجديد الإقامة</h2>
    
    <div class="form-group">
        <label for="expiryDate">تاريخ انتهاء الإقامة الحالية:</label>
        <div class="input-wrapper">
            <input type="text" id="expiryDate" class="date-input" placeholder="يوم / شهر / سنة" readonly>
            
            <button class="clear-btn" onclick="clearDate()" title="مسح التاريخ بالكامل">
                <svg class="trash-icon" viewBox="0 0 24 24">
                    <path d="M9 3v1H4v2h1v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6h1V4h-5V3H9m2 5h2v10h-2V8m-4 0h2v10H7V8m8 0h2v10h-2V8z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">التاريخ المستهدف (سنة إلا 10 أيام):</div>
        <div class="result-date" id="reminderDateText">-- / -- / ----</div>
    </div>
</div>

<script>
    // إعداد التخصيص العربي للتقويم مع تعديل الأرقام لتصبح إنجليزية تلقائياً
    flatpickr.l10ns.ar.numeralArr = []; // هذا السطر يقوم بإلغاء تحويل الأرقام إلى هندية (١، ٢، ٣)
    
    const picker = flatpickr("#expiryDate", {
        locale: "ar",            
        dateFormat: "d / m / Y", 
        disableMobile: "true",   
        onChange: function(selectedDates, dateStr, instance) {
            if (dateStr) {
                calculateReminderDate(selectedDates[0]);
            }
        }
    });

    function calculateReminderDate(selectedDate) {
        let expiryDate = new Date(selectedDate);

        expiryDate.setFullYear(expiryDate.getFullYear() - 1);
        expiryDate.setDate(expiryDate.getDate() + 10);

        const day = String(expiryDate.getDate()).padStart(2, '0');
        const month = String(expiryDate.getMonth() + 1).padStart(2, '0');
        const year = expiryDate.getFullYear();

        const formattedDate = `${day} / ${month} / ${year}`;

        document.getElementById('reminderDateText').innerText = formattedDate;
        document.getElementById('resultBox').style.display = 'block';
    }

    function clearDate() {
        picker.clear(); 
        document.getElementById('resultBox').style.display = 'none'; 
    }
</script>

</body>
</html>
