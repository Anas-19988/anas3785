<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة المتطورة</title>
    
    <meta name="google-site-verification" content="Apib7-x98H0j5cPqHWwSMm6dNU4GmODRoqxLiDzdx9I" />
    <meta name="description" content="حاسبة إلكترونية متطورة لحساب تاريخ تجديد الإقامة قبل سنة إلا 10 أيام مع ميزة الحفظ التلقائي والوضع الداكن.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <style>
        :root {
            --primary-color: #0284c7;
            --text-color: #0f172a; 
            --muted-text: #475569;
            --border-color: rgba(2, 132, 199, 0.3);
            --danger-color: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.55); 
            --box-bg: rgba(255, 255, 255, 0.85);
            --box-border: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            
            background: linear-gradient(
                to bottom,
                #74acdf 0%, #74acdf 33.33%,
                #ffffff 33.33%, #ffffff 66.66%,
                #74acdf 66.66%, #74acdf 100%
            );
            position: relative;
            overflow-x: hidden;
        }

        .sun-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18; 
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #0369a1; 
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
        }

        .pwa-install-btn {
            display: none; 
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }
        .pwa-install-btn:hover { background-color: #0369a1; transform: translateY(-1px); }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .hint-text {
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 10px;
            display: block;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border-radius: 12px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl; 
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
            font-weight: 600;
        }

        input.date-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .btn {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.95);
            box-sizing: border-box;
        }

        .clear-btn {
            background-color: rgba(254, 226, 226, 0.95);
            border-color: rgba(239, 68, 110, 0.3);
        }
        .clear-btn:hover { background-color: var(--danger-color); border-color: var(--danger-color); }
        .clear-btn:hover .trash-icon { fill: #ffffff; }
        .trash-icon { width: 20px; height: 20px; fill: #ef4444; }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.4);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(2, 132, 199, 0.15);
        }
        .toggle-label { font-weight: 600; font-size: 0.9rem; color: #0369a1; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #0284c7; }
        input:checked + .slider:before { transform: translateX(22px); }

        .custom-days-section {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            text-align: right;
        }
        .slider-wrapper { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .range-slider { flex: 1; accent-color: #0284c7; cursor: pointer; height: 6px; }
        .days-badge { background: #0284c7; color: #ffffff; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; font-variant-numeric: lining-nums; }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(2, 132, 199, 0.15);
            border: 2px solid var(--box-border);
            border-radius: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-title { font-size: 0.95rem; color: #0369a1; margin-bottom: 8px; font-weight: 700; }
        .result-date { font-size: 1.7rem; font-weight: 800; color: #0f172a; letter-spacing: 1px; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }
        
        .actions-wrapper { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .action-icon-btn { background-color: #ffffff; color: #0f172a; padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .action-icon-btn:hover { border-color: #0284c7; color: #0284c7; background-color: rgba(2, 132, 199, 0.05); }

        .countdown-text { margin-top: 10px; font-size: 0.9rem; color: #1e293b; font-weight: 600; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }

        .history-section { position: relative; z-index: 1; margin-top: 30px; text-align: right; width: 100%; max-width: 440px; }
        .history-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: #0369a1; }
        .history-table { width: 100%; border-collapse: collapse; background-color: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 14px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.8); font-size: 0.85rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .history-table th, .history-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(2, 132, 199, 0.15); font-variant-numeric: lining-nums; font-feature-settings: "lnum"; color: #0f172a; font-weight: 600; }
        .history-table th { background-color: rgba(2, 132, 199, 0.25); color: #0369a1; font-weight: 700; }
        .history-table tr:last-child td { border-bottom: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .flatpickr-calendar, .flatpickr-day, .flatpickr-months, .flatpickr-current-month .numInputWrapper {
            font-variant-numeric: lining-nums !important; font-feature-settings: "lnum" !important;
        }
    </style>
</head>
<body>

<svg class="sun-bg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="12" fill="#ebc034" stroke="#c99718" stroke-width="0.5"/>
    <g fill="none" stroke="#ebc034" stroke-width="1.2" stroke-linecap="round">
        <path d="M50 10 V35 M50 65 V90 M10 50 H35 M65 50 H90 M22 22 L38 38 M62 62 L78 78 M78 22 L62 38 M38 62 L22 78"/>
    </g>
</svg>

<div class="container">
    <button id="installAppBtn" class="pwa-install-btn" onclick="triggerPWAInstall()">📱 تثبيت التطبيق على الجوال</button>

    <h2>حاسبة تاريخ تجديد الإقامة الذكية</h2>
    
    <div class="form-group">
        <label for="expiryDate">تاريخ انتهاء الإقامة الحالية:</label>
        <span class="hint-text">اختر من التقويم أو اكتب مباشرة مثل: 25 / 12 / 2026</span>
        <div class="input-wrapper">
            <input type="text" id="expiryDate" class="date-input" placeholder="يوم / شهر / سنة" autocomplete="off">
            <button class="btn clear-btn" onclick="clearDate()" title="مسح التاريخ">
                <svg class="trash-icon" viewBox="0 0 24 24">
                    <path d="M9 3v1H4v2h1v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6h1V4h-5V3H9m2 5h2v10h-2V8m-4 0h2v10H7V8m8 0h2v10h-2V8z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="toggle-container">
        <div class="toggle-label">تعديل عدد الأيام يدوياً (سحب مخصص)</div>
        <label class="switch">
            <input type="checkbox" id="customToggle" onchange="toggleCustomDays()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="custom-days-section" id="customDaysSection">
        <label>اسحب لتحديد عدد الأيام المراد طرحها:</label>
        <div class="slider-wrapper">
            <input type="range" id="daysSlider" class="range-slider" min="1" max="90" value="10" oninput="handleSliderInput()">
            <span class="days-badge" id="daysValue">10 أيام</span>
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitleText">التاريخ المستهدف (سنة إلا 10 أيام):</div>
        <div class="result-date" id="reminderDateText">-- / -- / ----</div>
        <div class="countdown-text" id="countdownText"></div>
        
        <div class="actions-wrapper">
            <button class="action-icon-btn" onclick="copyResult()">📋 نسخ التاريخ</button>
            <button class="action-icon-btn" onclick="shareWhatsApp()" style="border-color:#22c55e; color:#22c55e;">🟢 مشاركة</button>
        </div>
    </div>
</div>

<div class="history-section" id="historySection" style="display: none;">
    <div class="history-title">آخر العمليات المحسوبة:</div>
    <table class="history-table">
        <thead>
            <tr>
                <th>تاريخ الانتهاء</th>
                <th>تاريخ التذكير</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    flatpickr.l10ns.ar.numeralArr = []; 
    let selectedGlobalDate = null;
    let originalGlobalStr = "";
    let deferredPrompt = null;
    const inputElement = document.getElementById("expiryDate");
    
    // إعداد التقويم مع السماح بالخيارين معاً والربط التلقائي
    const picker = flatpickr("#expiryDate", {
        locale: "ar",            
        dateFormat: "d / m / Y", 
        allowInput: true, // السماح بالكتابة اليدوية المباشرة داخل المكتبة
        disableMobile: "true",   
        onChange: function(selectedDates, dateStr, instance) {
            if (dateStr && selectedDates.length > 0) {
                selectedGlobalDate = selectedDates[0];
                originalGlobalStr = dateStr;
                calculateDate();
            }
        }
    });

    // مراقبة الكتابة اليدوية وفحص المدخلات لحظياً
    inputElement.addEventListener("input", function(e) {
        let value = e.target.value;
        
        // ذكاء اصطناعي برميجي صغير: يقوم بوضع الفواصل تلقائياً أثناء كتابة المستخدم لتسهيل الأمر
        value = value.replace(/\s+/g, "").replace(/\//g, "");
        if (value.length > 2 && value.length <= 4) {
            value = value.slice(0, 2) + " / " + value.slice(2);
        } else if (value.length > 4) {
            value = value.slice(0, 2) + " / " + value.slice(2, 4) + " / " + value.slice(4, 8);
        }
        
        // التحقق من اكتمال كتابة صيغة التاريخ بالكامل لتشغيل الحسبة فوراً
        const parts = value.split(" / ");
        if (parts.length === 3 && parts[2].length === 4) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            const parsedDate = new Date(year, month, day);
            
            if (!isNaN(parsedDate.getTime()) && parsedDate.getDate() === day && parsedDate.getMonth() === month) {
                selectedGlobalDate = parsedDate;
                originalGlobalStr = value;
                picker.setDate(parsedDate, false); // مزامنة التقويم الخلفي مع ما كتبه المستخدم
                calculateDate();
            }
        }
    });

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installAppBtn').style.display = 'block';
    });

    function triggerPWAInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                console.log('User accepted PWA');
            }
            deferredPrompt = null;
            document.getElementById('installAppBtn').style.display = 'none';
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const blob = new Blob([`self.addEventListener('fetch', (e) => {});`], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log(err));
        });
    }

    function toggleCustomDays() {
        const isChecked = document.getElementById('customToggle').checked;
        document.getElementById('customDaysSection').style.display = isChecked ? 'block' : 'none';
        if (selectedGlobalDate) calculateDate();
    }

    function handleSliderInput() {
        const days = document.getElementById('daysSlider').value;
        document.getElementById('daysValue').innerText = `${days} أيام`;
        if (selectedGlobalDate) calculateDate();
    }

    function calculateDate() {
        if (!selectedGlobalDate) return;
        
        let expiryDate = new Date(selectedGlobalDate);
        const isCustom = document.getElementById('customToggle').checked;
        
        if (isCustom) {
            const minusDays = parseInt(document.getElementById('daysSlider').value);
            expiryDate.setDate(expiryDate.getDate() - minusDays);
            document.getElementById('resultTitleText').innerText = `التاريخ المستهدف (قبل الموعد بـ ${minusDays} يوماً):`;
        } else {
            expiryDate.setFullYear(expiryDate.getFullYear() - 1);
            expiryDate.setDate(expiryDate.getDate() + 10);
            document.getElementById('resultTitleText').innerText = "التاريخ المستهدف (سنة إلا 10 أيام):";
        }

        const day = String(expiryDate.getDate()).padStart(2, '0');
        const month = String(expiryDate.getMonth() + 1).padStart(2, '0');
        const year = expiryDate.getFullYear();
        const targetDateStr = `${day} / ${month} / ${year}`;

        document.getElementById('reminderDateText').innerText = targetDateStr;
        document.getElementById('resultBox').style.display = 'block';

        updateCountdown(expiryDate);
        saveToHistory(originalGlobalStr, targetDateStr);
    }

    function updateCountdown(targetDate) {
        const today = new Date();
        today.setHours(0,0,0,0);
        targetDate.setHours(0,0,0,0);
        
        const timeDiff = targetDate - today;
        const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
        
        const countdownEl = document.getElementById('countdownText');
        if (daysDiff > 0) {
            countdownEl.innerText = `متبقي على هذا التاريخ: ${daysDiff} يوماً.`;
        } else if (daysDiff === 0) {
            countdownEl.innerText = `هذا التاريخ يصادف اليوم!`;
        } else {
            countdownEl.innerText = `هذا التاريخ مضى عليه ${Math.abs(daysDiff)} يوماً.`;
        }
    }

    function copyResult() {
        const dateText = document.getElementById('reminderDateText').innerText;
        navigator.clipboard.writeText(dateText).then(() => {
            alert('تم نسخ التاريخ بنجاح: ' + dateText);
        });
    }

    function shareWhatsApp() {
        const dateText = document.getElementById('reminderDateText').innerText;
        const text = `تاريخ التذكير المستهدف لتجديد الإقامة هو: ${dateText}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function clearDate() {
        picker.clear(); 
        selectedGlobalDate = null;
        inputElement.value = "";
        document.getElementById('resultBox').style.display = 'none'; 
    }

    function saveToHistory(expiry, reminder) {
        let history = JSON.parse(localStorage.getItem('iqama_history')) || [];
        if(history.length > 0 && history[0].reminder === reminder) return;
        
        history.unshift({ expiry, reminder });
        if (history.length > 5) history.pop();
        
        localStorage.setItem('iqama_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('iqama_history')) || [];
        const historySection = document.getElementById('historySection');
        const historyBody = document.getElementById('historyBody');
        
        if (history.length === 0) {
            historySection.style.display = 'none';
            return;
        }
        
        historyBody.innerHTML = '';
        history.forEach(item => {
            const row = `<tr><td>${item.expiry}</td><td>${item.reminder}</td></tr>`;
            historyBody.innerHTML += row;
        });
        historySection.style.display = 'block';
    }

    window.onload = function() {
        renderHistory();
    }
</script>

</body>
</html>
