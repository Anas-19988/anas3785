<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة</title>

    <meta name="description" content="حاسبة إلكترونية سريعة لحساب تاريخ تجديد الإقامة قبل سنة إلا 10 أيام بدقة وسهولة.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        /* حقل نصي ثابت عربي 100% لا يتغير اتجاهه أبداً عند الضغط */
        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl;    /* ثابت من اليمين إلى اليسار دائماً */
            background-color: #ffffff;
            cursor: pointer;
        }
        input.date-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .clear-btn {
            background-color: #fee2e2;
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .clear-btn:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }
        .clear-btn:hover .trash-icon {
            fill: #ffffff;
        }
        .trash-icon {
            width: 20px;
            height: 20px;
            fill: var(--danger-color);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 0.95rem;
            color: #0369a1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .result-date {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0c4a6e;
            letter-spacing: 1px;
        }
        /* تنسيق تخصيص التقويم الذكي ليكون متناسقاً وعربياً */
        .flatpickr-calendar {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
    </style>
</head>
<body>

        <div class="input-wrapper">
