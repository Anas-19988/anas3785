<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #eff6ff;
            border-right: 5px solid var(--primary-color);
            border-radius: 8px;
            text-align: right;
            display: none;
        }
        .result-title {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 5px;
        }
        .result-date {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1e3a8a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة موعد التجديد (سنة إلا 10 أيام)</h2>
    
    <div class="form-group">
        <label for="expiryDate">أدخل تاريخ انتهاء الإقامة:</label>
        <input type="date" id="expiryDate" onchange="calculateReminderDate()">
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">تاريخ التذكير المستهدف (قبل سنة و 10 أيام):</div>
        <div class="result-date" id="reminderDateText">-- / -- / ----</div>
    </div>
</div>

<script>
    function calculateReminderDate() {
        const inputDateValue = document.getElementById('expiryDate').value;
        if (!inputDateValue) return;

        // تحويل النص إلى تاريخ
        let expiryDate = new Date(inputDateValue);

        // الحسبة: نرجع سنة للخلف (طرح سنة)، ثم نتقدم 10 أيام (إضافة 10 أيام)
        expiryDate.setFullYear(expiryDate.getFullYear() - 1);
        expiryDate.setDate(expiryDate.getDate() + 10);

        // تنسيق التاريخ ليظهر بشكل مناسب (يوم / شهر / سنة)
        const day = String(expiryDate.getDate()).padStart(2, '0');
        const month = String(expiryDate.getMonth() + 1).padStart(2, '0'); // الأشهر تبدأ من 0 في الـ JS
        const year = expiryDate.getFullYear();

        const formattedDate = `${day} / ${month} / ${year}`;

        // عرض النتيجة وتغيير المظهر ليظهر الصندوق
        document.getElementById('reminderDateText').innerText = formattedDate;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
