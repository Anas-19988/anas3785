<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
        }
        /* ضبط حقل الإدخال ليدعم التنسيق العربي */
        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right;
            direction: rtl;
        }
        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 0.95rem;
            color: #0369a1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .result-date {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0c4a6e;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة تاريخ تجديد الإقامة</h2>
    
    <div class="form-group">
        <label for="expiryDate">تاريخ انتهاء الإقامة الحالية:</label>
        <!-- عند الضغط يتم فتح تقويم منظم بالكامل -->
        <input type="date" id="expiryDate" onchange="calculateReminderDate()">
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">التاريخ المستهدف (سنة إلا 10 أيام):</div>
        <div class="result-date" id="reminderDateText">-- / -- / ----</div>
    </div>
</div>

<script>
    function calculateReminderDate() {
        const inputDateValue = document.getElementById('expiryDate').value;
        if (!inputDateValue) return;

        // تحويل النص المُدخل إلى كائن تاريخ
        let expiryDate = new Date(inputDateValue);

        // الحسبة المطلوبة: نطرح سنة من التاريخ الحالي
        expiryDate.setFullYear(expiryDate.getFullYear() - 1);
        // نزيد 10 أيام للحصول على النتيجة الدقيقة
        expiryDate.setDate(expiryDate.getDate() + 10);

        // استخراج اليوم، الشهر، والسنة بشكل منفصل وتنسيقهم بخانتين
        const day = String(expiryDate.getDate()).padStart(2, '0');
        const month = String(expiryDate.getMonth() + 1).padStart(2, '0'); // الأشهر في البرمجة تبدأ من 0
        const year = expiryDate.getFullYear();

        // التنسيق العربي المطلوب: يوم / شهر / سنة
        const formattedDate = `${day} / ${month} / ${year}`;

        // عرض النتيجة النهائية داخل الصندوق
        document.getElementById('reminderDateText').innerText = formattedDate;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
