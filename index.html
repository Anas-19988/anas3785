    <style>
        :root {
            --primary-color: #0284c7;
            --text-color: #0f172a; 
            --muted-text: #334155;
            --border-color: rgba(2, 132, 199, 0.3);
            --danger-color: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.55); 
            --box-bg: rgba(255, 255, 255, 0.85);
            --box-border: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            
            background: linear-gradient(
                to bottom,
                #74acdf 0%, #74acdf 33.33%,
                #ffffff 33.33%, #ffffff 66.66%,
                #74acdf 66.66%, #74acdf 100%
            );
            position: relative;
            overflow-x: hidden;
        }

        .sun-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18; 
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #0369a1; 
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
        }

        /* زر تثبيت التطبيق المميز بالأعلى */
        .pwa-install-btn {
            display: none; /* يظهر فقط عند دعمه من المتصفح والجوال */
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }
        .pwa-install-btn:hover { background-color: #0369a1; transform: translateY(-1px); }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border-radius: 12px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl; 
            cursor: pointer;
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
            font-weight: 600;
        }

        input.date-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .btn {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.95);
            box-sizing: border-box;
        }

        .clear-btn {
            background-color: rgba(254, 226, 226, 0.95);
            border-color: rgba(239, 68, 110, 0.3);
        }
        .clear-btn:hover { background-color: var(--danger-color); border-color: var(--danger-color); }
        .clear-btn:hover .trash-icon { fill: #ffffff; }
        .trash-icon { width: 20px; height: 20px; fill: #ef4444; }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.4);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(2, 132, 199, 0.15);
        }
        .toggle-label { font-weight: 600; font-size: 0.9rem; color: #0369a1; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #0284c7; }
        input:checked + .slider:before { transform: translateX(22px); }

        .custom-days-section {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            text-align: right;
        }
        .slider-wrapper { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .range-slider { flex: 1; accent-color: #0284c7; cursor: pointer; height: 6px; }
        .days-badge { background: #0284c7; color: #ffffff; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; font-variant-numeric: lining-nums; }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(2, 132, 199, 0.15);
            border: 2px solid var(--box-border);
            border-radius: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-title { font-size: 0.95rem; color: #0369a1; margin-bottom: 8px; font-weight: 700; }
        .result-date { font-size: 1.7rem; font-weight: 800; color: #0f172a; letter-spacing: 1px; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }
        
        .actions-wrapper { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .action-icon-btn { background-color: #ffffff; color: #0f172a; padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .action-icon-btn:hover { border-color: #0284c7; color: #0284c7; background-color: rgba(2, 132, 199, 0.05); }

        .countdown-text { margin-top: 10px; font-size: 0.9rem; color: #1e293b; font-weight: 600; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }

        .history-section { position: relative; z-index: 1; margin-top: 30px; text-align: right; width: 100%; max-width: 440px; }
        .history-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: #0369a1; }
