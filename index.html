    <style>
        :root {
            --primary-color: #0284c7;
            --text-color: #f8fafc;
            --muted-text: #cbd5e1;
            --border-color: rgba(255, 255, 255, 0.2);
            --danger-color: #ef4444;
            --card-bg: rgba(15, 23, 42, 0.65); /* خلفية زجاجية داكنة لتناسب الصورة */
            --box-bg: rgba(12, 74, 110, 0.4);
            --box-border: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* إضافة صورة ميسي مع شعار الأرجنتين كخلفية كاملة للموقع */
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1671377317711-209bfd4dfec8?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px); /* تأثير ضبابي زجاجي احترافي خلف الصندوق */
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #38bdf8; /* لون سماوي مشرق متناسق مع علم الأرجنتين */
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--muted-text);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border-color);
            background-color: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            border-radius: 12px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl;   
            cursor: pointer;
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
        }

        input.date-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
        }

        .btn {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background-color: rgba(15, 23, 42, 0.6);
        }

        .clear-btn {
            background-color: rgba(254, 226, 226, 0.15);
            border-color: rgba(252, 165, 165, 0.4);
        }
        .clear-btn:hover { background-color: var(--danger-color); border-color: var(--danger-color); }
        .clear-btn:hover .trash-icon { fill: #ffffff; }
        .trash-icon { width: 20px; height: 20px; fill: #fca5a5; }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-title { font-size: 0.95rem; color: #38bdf8; margin-bottom: 8px; font-weight: 600; }
        .result-date { font-size: 1.7rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .actions-wrapper { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .action-icon-btn { background-color: rgba(15, 23, 42, 0.5); color: #ffffff; padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .action-icon-btn:hover { border-color: #38bdf8; color: #38bdf8; background-color: rgba(15, 23, 42, 0.8); }

        .countdown-text { margin-top: 10px; font-size: 0.9rem; color: #e2e8f0; font-weight: 500; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }
