<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تاريخ تجديد الإقامة المتطورة</title>
    
    <meta name="google-site-verification" content="Apib7-x98H0j5cPqHWwSMm6dNU4GmODRoqxLiDzdx9I" />
    <meta name="description" content="حاسبة إلكترونية متطورة لحساب تاريخ تجديد الإقامة قبل سنة إلا 10 أيام مع ميزة الحفظ التلقائي والوضع الداكن.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <style>
        :root {
            --primary-color: #0284c7;
            --text-color: #0f172a; /* لون داكن واضح جداً فوق الشفافية البيضاء */
            --muted-text: #334155;
            --border-color: rgba(2, 132, 199, 0.25);
            --danger-color: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.35); /* صندوق زجاجي نقي وشفاف لإظهار الأسطورة خلفه */
            --box-bg: rgba(255, 255, 255, 0.5);
            --box-border: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            
            /* رسم علم الأرجنتين برمجياً لضمان ثبات الموقع 100% وعرضه فورا */
            background: linear-gradient(
                to bottom,
                #74acdf 0%, #74acdf 33.33%,
                #ffffff 33.33%, #ffffff 66.66%,
                #74acdf 66.66%, #74acdf 100%
            );
            position: relative;
        }

        /* دمج صورة الأسطورة ميسي مع كأس العالم في منتصف العلم برمجياً بشكل متناسق مع الحاسبة */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            max-width: 550px;
            height: 380px;
            /* استخدام رابط موثوق وسريع لصورة ميسي الاحتفالية بكأس العالم بخلفية مفرغة */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-World-Cup-celebration_%28cropped%29.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            opacity: 0.85; /* تباين رائع يضمن جمال الموقع وسهولة القراءة */
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px); /* تأثير ضبابي راقي */
            -webkit-backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.7); /* إطار أبيض يبرز التصميم */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #0369a1; /* لون كحلي مميز من درجات ألوان الأرجنتين */
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input.date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.85);
            color: #0f172a;
            border-radius: 12px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: right; 
            direction: rtl; 
            cursor: pointer;
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum";
            font-weight: 600;
        }

        input.date-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .btn {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.85);
            box-sizing: border-box;
        }

        .clear-btn {
            background-color: rgba(254, 226, 226, 0.85);
            border-color: rgba(239, 68, 110, 0.3);
        }
        .clear-btn:hover { background-color: var(--danger-color); border-color: var(--danger-color); }
        .clear-btn:hover .trash-icon { fill: #ffffff; }
        .trash-icon { width: 20px; height: 20px; fill: #ef4444; }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(2, 132, 199, 0.15);
            border: 2px solid var(--box-border);
            border-radius: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-title { font-size: 0.95rem; color: #0369a1; margin-bottom: 8px; font-weight: 700; }
        .result-date { font-size: 1.7rem; font-weight: 800; color: #0f172a; letter-spacing: 1px; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }
        
        .actions-wrapper { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .action-icon-btn { background-color: #ffffff; color: #0f172a; padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .action-icon-btn:hover { border-color: #0284c7; color: #0284c7; background-color: rgba(2, 132, 199, 0.05); }

        .countdown-text { margin-top: 10px; font-size: 0.9rem; color: #1e293b; font-weight: 600; font-variant-numeric: lining-nums; font-feature-settings: "lnum"; }

        /* جدول السجل */
        .history-section { position: relative; z-index: 1; margin-top: 30px; text-align: right; width: 100%; max-width: 440px; }
        .history-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: #0369a1; }
        .history-table { width: 100%; border-collapse: collapse; background-color: rgba(255, 255, 255, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 14px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.7); font-size: 0.85rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .history-table th, .history-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(2, 132, 199, 0.15); font-variant-numeric: lining-nums; font-feature-settings: "lnum"; color: #0f172a; font-weight: 600; }
        .history-table th { background-color: rgba(2, 132, 199, 0.25); color: #0369a1; font-weight: 700; }
        .history-table tr:last-child td { border-bottom: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .flatpickr-calendar, .flatpickr-day, .flatpickr-months, .flatpickr-current-month .numInputWrapper {
            font-variant-numeric: lining-nums !important; font-feature-settings: "lnum" !important;
        }
    </style>
</head>
<body>

                </svg>
            </button>
        </div>
    </div>
